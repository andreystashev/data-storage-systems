# Example values only. Replace these locally before using a real cluster.
# stringData accepts plain text; Kubernetes converts it to Secret data.
apiVersion: v1
kind: Secret
metadata:
  name: japanese-learning-db-secret
  namespace: dss
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_DATABASE_PASSWORD"
  DATABASE_URL: "postgresql://username:REPLACE_WITH_DATABASE_PASSWORD@japanese-learning-db-service:5432/database"

---
# Example credential for the proposed language data API.
apiVersion: v1
kind: Secret
metadata:
  name: language-api-secret
  namespace: dss
type: Opaque
stringData:
  API_SECRET: "REPLACE_WITH_API_SECRET"
