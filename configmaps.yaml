# Application configuration (example URLs and credentials only).
apiVersion: v1
kind: ConfigMap
metadata:
  name: japanese-learning-app-config
  namespace: dss
data:
  EXTERNAL_API_URL: "http://language-api-service:8000"

---

# Database configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: japanese-learning-db-config
  namespace: dss
data:
  POSTGRES_USER: "username"
  POSTGRES_DB: "database"

---

# Proposed assessment service configuration (workload not supplied).
apiVersion: v1
kind: ConfigMap
metadata:
  name: assessment-service-config
  namespace: dss
data:
  EXTERNAL_SERVICE_URL: "http://language-api-service:8000"

---

# Notification queue configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-queue-config
  namespace: dss
data:
  NOTIFICATION_QUEUE_URL: "http://notification-queue-service:5672/"

---

# Language data API configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: language-api-config
  namespace: dss
data:
  LANGUAGE_API_URL: "http://external-language-api-service:8000"
